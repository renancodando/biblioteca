name: Teste temporário integração judicial
on:
  push:
    branches: [main]
    paths: ['.github/workflows/teste-presidencia-temporario.yml']
jobs:
  sintaxe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check api/observatorio-politico.js
          node --check dist/js/analise-juridica-2026-regras.js
          node --check dist/js/dossie-eleitoral-2026.js
          node --check dist/js/dossie-eleitoral-integracao.js
          node --check dist/js/presidencia-judicial-integracao.js
          node --check dist/js/experiencias.js
