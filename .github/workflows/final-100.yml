name: Busca final - 100 livros
on:
  push:
    paths:
      - 'tests/final-100.mjs'
      - '.github/workflows/final-100.yml'
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rodar 100 buscas reais
        run: node tests/final-100.mjs
