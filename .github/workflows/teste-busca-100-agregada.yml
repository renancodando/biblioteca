name: Teste de busca - 100 livros agregados
on:
  push:
    paths:
      - 'tests/live-search-aggregator.mjs'
      - '.github/workflows/teste-busca-100-agregada.yml'
  workflow_dispatch:
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rodar 100 buscas reais
        run: node tests/live-search-aggregator.mjs
