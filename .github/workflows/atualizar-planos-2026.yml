name: Atualizar planos presidenciais 2026

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0,6,12,18 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/atualizar-planos-2026.yml'
      - 'scripts/gerar_planos_2026.py'

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install pypdf reportlab

      - name: Gerar PDF único, PDFs individuais, páginas e versões
        run: python scripts/gerar_planos_2026.py

      - name: Publicar arquivos gerados
        run: |
          git config user.name "biblioteca-livre-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/documentos/planos-governo-2026-presidencia.pdf dist/documentos/planos-governo-2026 dist/dados/planos-governo-2026
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos documentos oficiais."
            exit 0
          fi
          git commit -m "Atualiza planos oficiais 2026 [skip ci]"
          git push
