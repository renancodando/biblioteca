name: Teste temporário desktop política
on:
  push:
    branches: [main]
    paths: ['.github/workflows/teste-desktop-politica-temporario.yml']
jobs:
  sintaxe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check dist/js/modulos-lazy-mobile.js
          node --check dist/js/experiencias.js
