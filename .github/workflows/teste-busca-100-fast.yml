name: Teste de busca - 100 livros - fast
on:
  push:
    paths:
      - 'tests/live-search-100-fast.mjs'
      - '.github/workflows/teste-busca-100-fast.yml'
  workflow_dispatch:
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar 100 títulos nas fontes reais
        run: node tests/live-search-100-fast.mjs
