name: Teste de busca - 100 livros
on:
  push:
    paths:
      - 'tests/live-search.mjs'
      - '.github/workflows/teste-busca-100.yml'
  workflow_dispatch:
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rodar 100 testes ao vivo
        run: node tests/live-search.mjs
