name: Google Books smoke
on:
  push:
    paths:
      - 'tests/google-smoke.mjs'
      - '.github/workflows/google-smoke.yml'
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/google-smoke.mjs
